<main class="checkout-page">
  <header class="checkout-header">
    <button type="button" (click)="service.setView('landing')">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
      {{ prefs.t('checkout.back') }}
    </button>
    <img src="logo.png" alt="Licenfy">
  </header>
  <section class="checkout-shell">
    <div class="checkout-intro">
      <h1>{{ prefs.t('checkout.title') }}</h1>
      <p>{{ prefs.t('checkout.description') }}</p>
    </div>
    <div class="checkout-form">
      <div class="chosen-plan">
        <strong>{{ planName() }}</strong>
        <strong class="price">
          R$ {{ annual() ? '1.200' : '200' }}
          <small>{{ prefs.t(annual() ? 'landing.annualPeriod' : 'landing.monthlyPeriod') }}</small>
        </strong>
      </div>
      <button type="button" class="checkout-submit" (click)="service.openSignup()">
        {{ prefs.t('checkout.trial') }}
      </button>
    </div>
  </section>
</main>
